<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充值分析报告</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F2;
    --card: #FFFFFF;
    --border: rgba(0,0,0,0.06);
    --text: #1A1A1A;
    --t2: #6B6B6B;
    --t3: #A0A0A0;
    --accent: #C8553D;
    --accent-soft: #FDF2EF;
    --accent-deep: #8B3A2A;
    --blue: #2563EB;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 30px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 80px 28px 96px;
  }

  /* Hero */
  .hero {
    text-align: center;
    margin-bottom: 64px;
    position: relative;
  }
  .hero::before {
    content: '';
    display: block;
    width: 80px;
    height: 3px;
    background: var(--accent);
    margin: 0 auto 32px;
    border-radius: 2px;
  }
  .hero h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 48px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .hero .subtitle {
    font-size: 16px;
    color: var(--t2);
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  .hero .subtitle span {
    color: var(--accent);
    font-weight: 600;
  }

  /* Section */
  .section-label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    margin-top: 48px;
  }
  .section-label:first-of-type { margin-top: 0; }
  .section-label .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-label .dot.orange { background: var(--accent); }
  .section-label .dot.blue { background: var(--blue); }
  .section-label h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--t3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #E5E3E0;
  }

  /* Cards */
  .card-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 28px;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.3s;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
    border-color: rgba(200, 85, 61, 0.15);
  }
  .card:hover::before {
    background: var(--accent);
  }
  .card-body h3 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .card-body p {
    font-size: 13px;
    color: var(--t3);
    line-height: 1.5;
    max-width: 520px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .tag.latest {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag.activity {
    background: #EEF2FF;
    color: var(--blue);
  }
  .tag.archive {
    background: #F3F4F6;
    color: var(--t3);
  }
  .arrow {
    width: 20px;
    height: 20px;
    color: var(--t3);
    transition: color 0.3s, transform 0.3s;
    flex-shrink: 0;
  }
  .card:hover .arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  /* Footer */
  footer {
    margin-top: 80px;
    text-align: center;
    padding-top: 32px;
    border-top: 1px solid #E5E3E0;
  }
  footer p {
    font-size: 12px;
    color: var(--t3);
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero { animation: fadeUp 0.6s ease-out; }
  .card { animation: fadeUp 0.5s ease-out both; }
  .card:nth-child(1) { animation-delay: 0.15s; }
  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.25s; }
  .card:nth-child(4) { animation-delay: 0.3s; }
  .card:nth-child(5) { animation-delay: 0.35s; }

  @media (max-width: 640px) {
    .container { padding: 48px 16px 64px; }
    .hero h1 { font-size: 34px; }
    .card { padding: 20px; flex-wrap: wrap; gap: 12px; }
    .card-meta { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
